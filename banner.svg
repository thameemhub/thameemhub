<svg xmlns="http://www.w3.org/2000/svg" width="900" height="264" viewBox="0 0 900 264" role="img" aria-label="Mohammed Thameem Sulthan M — AI and Data Science Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="264" rx="10" fill="#080C14"/>
  <rect x="0" y="0" width="900" height="120" rx="10" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g stroke="#00A8FF" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M28 70 L28 28 L96 28"/>
    <path d="M872 70 L872 28 L804 28"/>
    <path d="M28 194 L28 236 L96 236"/>
    <path d="M872 194 L872 236 L804 236"/>
  </g>

  <!-- eyebrow pill -->
  <g>
    <rect x="322" y="46" width="256" height="24" rx="12" fill="none" stroke="#00A8FF" stroke-opacity="0.55" stroke-width="1"/>
    <text class="mono" x="450" y="62" text-anchor="middle" font-size="11" letter-spacing="2.4" fill="#00A8FF">BUILDING WITH LANGUAGE MODELS</text>
  </g>

  <!-- name -->
  <text class="mono" x="450" y="122" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="1.5" fill="#00A8FF" filter="url(#glow)" opacity="0.8">MOHAMMED THAMEEM SULTHAN M</text>
  <text class="mono" x="450" y="122" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MOHAMMED THAMEEM SULTHAN M</text>

  <!-- role line -->
  <text class="mono" x="450" y="152" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="3" fill="#C9D4DE">AI &amp; DATA SCIENCE ENGINEER &#183; LLMs &#183; RAG &#183; CHATBOTS</text>

  <!-- divider dot -->
  <circle cx="450" cy="170" r="2.5" fill="#00A8FF"/>

  <!-- tagline -->
  <text class="mono" x="450" y="194" text-anchor="middle" font-size="12" letter-spacing="1.2" fill="#7D8A99">turning research papers into things people can actually use</text>

  <!-- motto -->
  <g>
    <line x1="230" y1="220" x2="330" y2="220" stroke="#00A8FF" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="570" y1="220" x2="670" y2="220" stroke="#00A8FF" stroke-opacity="0.35" stroke-width="1"/>
    <text class="mono" x="450" y="225" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4.5" fill="#00A8FF" filter="url(#softglow)" opacity="0.7">LEARNING AND LEADING NEXT</text>
    <text class="mono" x="450" y="225" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4.5" fill="#00A8FF">LEARNING AND LEADING NEXT</text>
  </g>
</svg>
