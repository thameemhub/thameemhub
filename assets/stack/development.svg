<svg xmlns="http://www.w3.org/2000/svg" width="360" height="86" viewBox="0 0 360 86" role="img">
<title>Development tools — Git · FastAPI · Streamlit · Docker</title>
<defs>
<linearGradient id="ground" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#16151F"/><stop offset=".55" stop-color="#0A0A10"/><stop offset="1" stop-color="#171019"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#BA1038" stop-opacity=".55"/><stop offset=".62" stop-color="#68102D" stop-opacity=".28"/><stop offset="1" stop-color="#190D17" stop-opacity="0"/></radialGradient>
<linearGradient id="blade" x2=".85" y2="1"><stop stop-color="#FFF3F5"/><stop offset=".2" stop-color="#FF8297"/><stop offset=".62" stop-color="#FF1744"/><stop offset="1" stop-color="#6A0929"/></linearGradient>
<linearGradient id="platinum" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".62" stop-color="#F4F6FC"/><stop offset="1" stop-color="#ADB3C1"/></linearGradient>
<pattern id="dust" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#888292" opacity=".32"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<style>
@keyframes flow{to{stroke-dashoffset:-250}}
@keyframes breathe{50%{opacity:.35}}
@keyframes drift{50%{transform:translateY(-5px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
.signal{stroke-dasharray:9 241;animation:flow 10s linear infinite}
.light{animation:breathe 6s ease-in-out infinite}
.floating{animation:drift 8s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
